<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Language, decided before anything renders and from the browser alone:
      // a visitor whose browser lists Chinese ahead of English goes to /zh/.
      // Nothing is stored or read back. Acts only on / itself, so the same
      // page copied to /en/ is a stable English address: that is where the
      // footer's English link points, and it never redirects.
      (function () {
        var path = location.pathname;
        if (path !== "/" && path !== "/index.html") return;
        var langs = navigator.languages || [navigator.language || ""];
        for (var i = 0; i < langs.length; i++) {
          if (/^en\b/i.test(langs[i])) return;
          if (/^zh\b/i.test(langs[i])) {
            location.replace("/zh/" + location.search + location.hash);
            return;
          }
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>VTracer 2</title>
    <meta
      name="description"
      content="The best vectorizer that runs on your device. A deep-learning based tracing engine, perfect for prompt to vector and artistic workflow."
    />
    <meta name="theme-color" content="#000000" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="VTracer 2" />
    <meta
      property="og:description"
      content="The best vectorizer that runs on your device. A deep-learning based tracing engine, perfect for prompt to vector and artistic workflow."
    />
    <meta property="og:url" content="https://vtracer.visioncortex.org/" />
    <meta property="og:image" content="https://vtracer.visioncortex.org/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://vtracer.visioncortex.org/" />
    <!-- The same page in each language, for search engines. -->
    <link rel="alternate" hreflang="en" href="https://vtracer.visioncortex.org/" />
    <link rel="alternate" hreflang="zh-Hans" href="https://vtracer.visioncortex.org/zh/" />
    <link rel="alternate" hreflang="x-default" href="https://vtracer.visioncortex.org/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
